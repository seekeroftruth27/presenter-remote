<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PP Remote">
<meta name="theme-color" content="#111">
<title>PP Remote</title>
<style>
  /* ---- phone remote for ProPresenter ---------------------------------------
     Remote: the live slide, the live item's slides, thumb-sized Prev/Next (Next
     is the biggest target because it's pressed most). Playlist: arrangements,
     show items, reorder, add from a library, remove. Macros: the stage team's
     macros. All ProPresenter calls are in pp.js. */
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:#111; color:#eee; font:16px/1.35 -apple-system, system-ui, sans-serif;
         display:flex; flex-direction:column; gap:12px;
         padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .tabs { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; background:#1c1c1c;
          border-radius:10px; padding:3px; }
  .tabs button { background:transparent; color:#999; font-size:20px; padding:17px 0; border-radius:8px; }
  .tabs button.on { background:#333; color:#fff; }
  .view { flex:1; display:flex; flex-direction:column; gap:12px; min-height:0; }
  .view[hidden] { display:none; }
  #state { font-size:16px; color:#8a8; min-height:1.3em; }
  #state.bad { color:#e77; }
  /* live preview: the active presentation's slides, current one ringed */
  .nowbar { display:flex; align-items:center; gap:12px; }
  #now { display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  /* Thumbnail zoom: 1-5 columns; right = bigger slides (fewer columns). */
  .zoom { display:flex; align-items:center; gap:6px; flex:none; color:#888; font-size:14px; }
  .zoom input { width:96px; accent-color:#f59e0b; }
  #now .item { font-weight:600; font-size:24px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #now .pl { font-size:16px; color:#888; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Live panel: the slide on screen right now, big, whatever the grid is doing. */
  .live { display:flex; gap:10px; align-items:stretch; background:#1c1c1c; border-radius:12px;
          padding:8px; border-left:4px solid var(--gc, #f59e0b); flex:none; }
  .live[hidden] { display:none; }
  .limg { width:46%; flex:none; aspect-ratio:16 / 9; border-radius:6px; outline:2px solid #f59e0b;
          background:#000 center / contain no-repeat; display:flex; align-items:center;
          justify-content:center; padding:4px; font-size:10px; line-height:1.2; color:#ccc;
          text-align:center; white-space:pre-wrap; overflow:hidden; }
  .limg.pic { color:transparent; }
  .linfo { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .lhdr { font-size:11px; font-weight:700; letter-spacing:.08em; color:#f59e0b; }
  .lgrp { font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ltext { font-size:13px; color:#bbb; white-space:pre-wrap; overflow:hidden; display:-webkit-box;
           -webkit-box-orient:vertical; -webkit-line-clamp:3; }
  #slides { flex:1; min-height:120px; overflow-y:auto; -webkit-overflow-scrolling:touch;
            --cols:2; display:grid; grid-template-columns:repeat(var(--cols), minmax(0, 1fr));
            gap:calc(14px - var(--cols) * 2px); align-content:start;
            grid-auto-rows:max-content;   /* full-size cells that scroll, never squeezed to fit */
            container-type:size;          /* so a cell can be capped to the visible height below */
            padding:3px; }
  .empty { color:#555; font-style:italic; grid-column:1 / -1; text-align:center; padding:24px 0; }
  .cue { position:relative; background:#1c1c1c; border-radius:8px; overflow:hidden;
         outline:3px solid transparent; outline-offset:0; }
  .cue .img { aspect-ratio:16 / 9; background:#000 center / contain no-repeat;
              display:flex; align-items:center; justify-content:center; padding:4px;
              font-size:calc(18px / var(--cols)); line-height:1.2; color:#ccc; text-align:center;
              white-space:pre-wrap; overflow:hidden; }
  .cue .img.pic { color:transparent; }
  /* A cell never taller than the visible grid (big zoom in landscape), so the live
     slide can always be shown whole; the picture letterboxes inside it. */
  .cue .img { max-height:calc(100cqh - 40px); margin-inline:auto; }
  .cue .cap { display:flex; gap:6px; align-items:center; padding:5px 8px 6px;
              font-size:calc(9px + 6px / var(--cols));
              line-height:1.3; color:#aaa; }
  .cue .n { color:#666; }
  .cue .grp { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cue .bar { position:absolute; left:0; top:0; bottom:0; width:4px; }
  .cue.off { opacity:.35; }
  .cue { cursor:pointer; touch-action:manipulation; }
  .cue.pend { outline-color:#f59e0b88; }
  .cue.on { outline-color:#f59e0b; }
  .cue.on .cap { background:#f59e0b; color:#111; }
  .cue.on .n { color:#111; }
  #slides.dense .cue .grp { display:none; }        /* 4-5 columns: just the number */
  #slides.dense .cue .cap { padding:2px 5px 3px; justify-content:center; }
  .pad { display:grid; grid-template-columns:1fr 2fr; gap:12px; height:110px; flex:none; }
  .pad button { font-size:clamp(22px, 6vw, 44px); font-weight:800; letter-spacing:.04em; white-space:nowrap; }
  button { border:0; border-radius:14px; color:#fff; font:600 18px/1 inherit;
           font-family:inherit; touch-action:manipulation; user-select:none;
           -webkit-user-select:none; transition:transform .06s, filter .06s; }
  button:active { transform:scale(.97); filter:brightness(1.3); }
  button:disabled { opacity:.5; }
  #previous { background:#333; }
  #next { background:#2563eb; }
  /* Clear slide sits in the top bar, small and quiet: it's needed, but rarely. */
  #clear-slide { flex:none; min-height:48px; padding:0 14px; background:#2a2a2a; color:#bbb;
                 font-size:15px; font-weight:600; border-radius:12px; }
  @media (max-width:600px) {   /* phone: title on its own line, slider and Clear slide below */
    .nowbar { flex-wrap:wrap; row-gap:6px; } #now { flex-basis:100%; } .zoom { margin-right:auto; }
  }

  /* macros tab: one button per ProPresenter macro, in its colour. First tap arms
     it ("tap again"), a second tap within a few seconds runs it. */
  .macmsg { flex:1; font-size:16px; color:#8a8; align-self:center; }
  .macmsg.bad { color:#e77; }
  #macros { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr));
            gap:10px; align-content:start; grid-auto-rows:max-content; padding:3px;
            -webkit-overflow-scrolling:touch; }
  .mac { --c:#333; background-color:var(--c); color:var(--t, #fff); min-height:128px; padding:12px;
         font-size:24px; font-weight:700; line-height:1.2; border-radius:12px; overflow-wrap:anywhere;
         outline:3px solid transparent; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:4px; }
  .mac small { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
               display:none; }
  .mac.armed { outline-color:#fbbf24; animation:armed .8s ease-in-out infinite alternate; }
  .mac.armed small { display:block; }
  @keyframes armed { from { filter:brightness(1); } to { filter:brightness(1.35); } }
  #macros .empty { color:#666; }

  /* settings tab (app only) */
  .tabs #tab-settings { flex:none; }
  .field { display:flex; flex-direction:column; gap:6px; font-size:14px; color:#aaa; }
  .field input { font:inherit; font-size:18px; color:#eee; background:#1c1c1c;
                 border:1px solid #333; border-radius:10px; padding:12px; }
  .hint { margin:0; font-size:13px; color:#888; }
  #ppsave { background:#2563eb; padding:16px; }
  #setmsg { font-size:14px; color:#8a8; min-height:1.3em; }
  #setmsg.bad { color:#e77; }

  /* playlist tab */
  select { width:100%; font:inherit; font-size:16px; color:#eee; background:#1c1c1c;
           border:1px solid #333; border-radius:10px; padding:10px; }
  .plbar { display:flex; gap:8px; }
  .plbar select { flex:1; min-width:0; }
  .plbar button { background:#333; font-size:15px; padding:0 14px; }
  .plbar button.reload { font-size:38px; min-width:84px; min-height:68px; padding:0 12px; }
  #plsel { font-size:20px; padding:20px 12px; }
  #plmsg { font-size:15px; color:#8a8; min-height:1.3em; }
  #plmsg.bad { color:#e77; }
  #items { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
           -webkit-overflow-scrolling:touch; }
  .hdr { font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:#888;
         margin:8px 2px 0; }
  /* One playlist item per row: grip, name, arrangement, play, remove. On a phone
     the arrangement drops to a second line. */
  .song { background:#1c1c1c; border-radius:12px; padding:8px 10px; display:grid; gap:6px 10px;
          align-items:center; grid-template-areas:"grip nm arr play rm";
          grid-template-columns:44px minmax(0, 1fr) minmax(0, 300px) 68px 68px; }
  @media (max-width:600px) {
    .song { grid-template-areas:"grip nm play rm" "grip arr arr arr";
            grid-template-columns:36px minmax(0, 1fr) 60px 60px; }
  }
  .song .nm { grid-area:nm; font-weight:600; font-size:20px; min-width:0; overflow-wrap:anywhere; }
  .song select, .song .other { grid-area:arr; }
  .song select { font-size:17px; }
  .grip { grid-area:grip; align-self:stretch; display:flex; align-items:center; justify-content:center;
          color:#888; touch-action:none; cursor:grab; }
  .grip svg, .rm svg { width:26px; height:26px; }
  .play, .rm { min-height:56px; font-size:24px; border-radius:12px; padding:0;
               display:flex; align-items:center; justify-content:center; }
  .play { grid-area:play; background:#166534; }
  .rm { grid-area:rm; background:#3a2323; }
  .song.ro { opacity:.4; }
  .song.drag { outline:2px solid #f59e0b; background:#262626; }
  .wide { background:#333; font-size:16px; padding:14px; flex:none; }
  #pladd { background:#166534; font-size:21px; padding:20px; }
  #adder { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
  #adder[hidden], #items[hidden], #pladd[hidden] { display:none; }
  #libq { font:inherit; font-size:16px; color:#eee; background:#1c1c1c; border:1px solid #333;
          border-radius:10px; padding:10px; }
  #libitems { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;
              -webkit-overflow-scrolling:touch; }
  .libitem { background:#1c1c1c; color:#eee; text-align:left; font-weight:500; font-size:16px;
             padding:12px; border-radius:10px; }
  .libmore { color:#888; font-size:13px; padding:4px 2px; }
  .song.busy { opacity:.6; }
  .other { color:#888; font-size:14px; padding:2px 12px; }
</style>
</head>
<body>
  <div class="tabs">
    <button id="tab-remote" class="on" data-view="v-remote">Remote</button>
    <button id="tab-playlist" data-view="v-playlist">Playlist</button>
    <button id="tab-macros" data-view="v-macros">Macros</button>
    <button id="tab-settings" data-view="v-settings" hidden>⚙</button>
  </div>

  <div class="view" id="v-remote">
    <div id="state">Connecting…</div>
    <div class="nowbar">
      <div id="now"><div class="item" id="item">—</div><div class="pl" id="pl"></div></div>
      <label class="zoom" title="Slide size"><span aria-hidden="true">▫</span>
        <input id="zoom" type="range" min="1" max="5" step="1" value="4" aria-label="Slide size">
        <span aria-hidden="true">◻</span></label>
      <button id="clear-slide" data-act="clear-slide">Clear slide</button>
    </div>
    <div id="live" class="live" hidden>
      <div id="liveimg" class="limg"></div>
      <div class="linfo">
        <div class="lhdr">LIVE · <span id="livepos"></span></div>
        <div id="livegrp" class="lgrp"></div>
        <div id="livetext" class="ltext"></div>
      </div>
    </div>
    <div id="slides"><div class="empty">Nothing showing</div></div>
    <div class="pad">
      <button id="previous" data-act="previous">◀ PREV</button>
      <button id="next" data-act="next">NEXT ▶</button>
    </div>
  </div>

  <div class="view" id="v-playlist" hidden>
    <div class="plbar">
      <select id="plsel" aria-label="Playlist"><option value="">Loading playlists…</option></select>
      <button id="plreload" class="reload" aria-label="Reload">↻</button>
    </div>
    <div id="plmsg"></div>
    <div id="items"></div>
    <button id="pladd" class="wide" hidden>+ Add from library</button>
    <div id="adder" hidden>
      <div class="plbar">
        <select id="libsel" aria-label="Library"></select>
        <button id="addclose" aria-label="Close">Done</button>
      </div>
      <input id="libq" type="search" placeholder="Search this library" autocapitalize="off"
             autocorrect="off" spellcheck="false" aria-label="Search">
      <div id="libitems"></div>
    </div>
  </div>

  <div class="view" id="v-macros" hidden>
    <div class="plbar">
      <div id="macmsg" class="macmsg">Tap a macro, then tap again to run it.</div>
      <button id="macreload" class="reload" aria-label="Reload macros">↻</button>
    </div>
    <div id="macros"></div>
  </div>

  <div class="view" id="v-settings" hidden>
    <label class="field">ProPresenter address
      <input id="ppurl" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="192.168.1.50:1025">
    </label>
    <p class="hint">In ProPresenter: <b>Settings → Network</b>. Turn on <b>Enable Network</b>
      and enter the IP address and port shown there. The phone must be on the same Wi-Fi.</p>
    <button id="ppsave">Save &amp; connect</button>
    <div id="setmsg"></div>
  </div>
<script src="pp.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = $("state");
  const OTHER = "\u0000other", NONE = "";

  function show(ok, msg) {
    state.textContent = msg;
    state.classList.toggle("bad", !ok);
  }

  function plmsg(ok, msg) {
    $("plmsg").textContent = msg;
    $("plmsg").classList.toggle("bad", !ok);
  }

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ---- backend -------------------------------------------------------------
  // pp.js talks to ProPresenter's API. In the iPhone app (Capacitor) it calls
  // ProPresenter directly, at the address set under ⚙. In a browser the page is
  // served by proxy/pp_proxy.py, which forwards /v1/... to ProPresenter from the
  // same origin -- ProPresenter's API sends no CORS headers, so a browser page
  // can't call it directly.
  const APP = !!(window.Capacitor && window.Capacitor.isNativePlatform &&
                 window.Capacitor.isNativePlatform());
  let api = window.PPDirect.create(APP ? store.get("pp-url") : location.origin);

  // ---- tabs --------------------------------------------------------------
  let playlistsLoaded = false;
  function openTab(btn) {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b === btn));
    document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== btn.dataset.view);
    store.set("pp-tab", btn.id);
    if (btn.id === "tab-playlist" && !playlistsLoaded) loadPlaylists();
    if (btn.id === "tab-macros" && !macrosLoaded) loadMacros();
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => openTab(b)));

  // ---- remote: live preview ----------------------------------------------
  // The grid is rebuilt only when the presentation changes; each poll just moves
  // the highlight. Thumbnails are ProPresenter's own renders; until one loads (or
  // if it can't) the cell shows the slide's text instead.
  let shownUuid = "", shownIndex = null, loadedAt = 0;

  // Thumbnails are rendered by ProPresenter, which is busy running the service,
  // so they're fetched only for cells on (or near) screen and at most
  // THUMBS_AT_ONCE at a time -- not one request per slide the moment a song goes
  // live. The current slide is scrolled into view, so it loads first.
  const THUMBS_AT_ONCE = 2;
  let thumbQueue = [], thumbsLoading = 0, thumbUuid = "";
  const thumbWatch = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      thumbWatch.unobserve(e.target);
      thumbQueue.push(e.target);
    }
    pumpThumbs();
  }, { root: $("slides"), rootMargin: "150px 0px" });

  function pumpThumbs() {
    while (thumbsLoading < THUMBS_AT_ONCE && thumbQueue.length) {
      const img = thumbQueue.shift(), uuid = thumbUuid, i = Number(img.dataset.i);
      thumbsLoading++;
      const done = () => { thumbsLoading--; pumpThumbs(); };
      const pic = new Image();
      pic.onload = () => { img.style.backgroundImage = `url("${pic.src}")`; img.classList.add("pic"); done(); };
      pic.onerror = () => {
        // In the app the web view may refuse a plain-http image; fetch it natively then.
        if (api.thumbBlobUrl && !pic.dataset.retried) {
          pic.dataset.retried = "1";
          api.thumbBlobUrl(uuid, i).then(u => { pic.src = u; }, done);
        } else done();
      };
      pic.src = api.thumbUrl(uuid, i);
    }
  }

  let liveSlides = [], liveKey = "";
  function buildSlides(uuid, slides) {
    liveSlides = slides;
    const grid = $("slides");
    thumbWatch.disconnect();
    thumbQueue = [];
    thumbUuid = uuid;
    grid.innerHTML = "";
    loadedAt = Date.now();
    if (!slides.length) {
      grid.innerHTML = '<div class="empty">No slides</div>';
      return;
    }
    slides.forEach((s, i) => {
      const cue = document.createElement("div");
      cue.className = "cue" + (s.enabled ? "" : " off");
      const img = document.createElement("div");
      img.className = "img";
      img.textContent = s.text;
      img.dataset.i = i;
      thumbWatch.observe(img);
      const cap = document.createElement("div");
      cap.className = "cap";
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = i + 1;
      const grp = document.createElement("span");
      grp.className = "grp";
      grp.textContent = s.label || s.group;
      cap.append(n, grp);
      cue.append(img, cap);
      if (s.color) {
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.background = s.color;
        cue.appendChild(bar);
      }
      cue.addEventListener("click", () => jump(uuid, i, cue));
      grid.appendChild(cue);
    });
  }

  function highlight(index) {
    if (index === shownIndex) return;
    shownIndex = index;
    const cues = $("slides").querySelectorAll(".cue");
    cues.forEach((c, i) => c.classList.toggle("on", i === index));
    follow();
    showLive(index);
  }

  // The Live panel: the on-screen slide's thumbnail (fetched straight away; it is
  // the one picture that matters), its position, group and text.
  function showLive(index) {
    const panel = $("live"), s = liveSlides[index];
    if (index == null || !thumbUuid) { panel.hidden = true; liveKey = ""; return; }
    panel.hidden = false;
    $("livepos").textContent = liveSlides.length && index < liveSlides.length
      ? `Slide ${index + 1} of ${liveSlides.length}` : `Slide ${index + 1}`;
    $("livegrp").textContent = s ? (s.label || s.group || "") : "";
    $("livetext").textContent = s ? s.text : "";
    panel.style.setProperty("--gc", (s && s.color) || "#f59e0b");
    const key = `${thumbUuid}/${index}`;
    if (key === liveKey) return;
    liveKey = key;
    // Keep showing the previous picture until the new one arrives, rather than
    // flashing the slide's text in between; fall back to the text if it's slow.
    const img = $("liveimg");
    img.textContent = s ? s.text : "";
    const slow = setTimeout(() => {
      if (liveKey === key) { img.classList.remove("pic"); img.style.backgroundImage = ""; }
    }, 700);
    const uuid = thumbUuid, pic = new Image();
    pic.onload = () => {
      clearTimeout(slow);
      if (liveKey === key) { img.style.backgroundImage = `url("${pic.src}")`; img.classList.add("pic"); }
    };
    pic.onerror = () => {
      if (api.thumbBlobUrl && !pic.dataset.retried) {
        pic.dataset.retried = "1";
        api.thumbBlobUrl(uuid, index).then(u => { pic.src = u; }, () => {});
      }
    };
    pic.src = api.thumbUrl(uuid, index);
  }

  // Keep the live slide on screen: if it (or, room permitting, the slide after
  // it) is outside the grid's visible area, scroll just enough to bring it in.
  // Runs when the slide changes, the zoom changes or the screen rotates; in
  // between, the operator can scroll around freely. It jumps rather than glides:
  // an animated scroll on every slide change is distracting on stage.
  function follow() {
    const grid = $("slides"), cues = grid.querySelectorAll(".cue");
    const cur = cues[shownIndex];
    if (!cur) return;
    const nxt = cues[shownIndex + 1] || cur;
    const top0 = grid.getBoundingClientRect().top - grid.scrollTop;
    const curTop = cur.getBoundingClientRect().top - top0;
    const curBottom = cur.getBoundingClientRect().bottom - top0;
    const nxtBottom = nxt.getBoundingClientRect().bottom - top0;
    const view = grid.clientHeight, pad = 8, st = grid.scrollTop;
    let target = st;
    if (curTop - pad < st || curBottom + pad > st + view) {
      target = curTop - pad;                               // live slide off screen: bring it in
    }
    if (nxtBottom + pad > target + view) {                 // and show the next one if it fits
      target = Math.min(curTop - pad, nxtBottom + pad - view);
    }
    target = Math.max(0, target);
    if (Math.abs(target - st) > 1) grid.scrollTop = target;
  }

  // Zoom: the slider picks the column count (right = bigger slides = fewer columns).
  function setZoom(z) {
    z = Math.min(5, Math.max(1, Number(z) || 4));
    const cols = 6 - z, grid = $("slides");
    grid.style.setProperty("--cols", cols);
    grid.classList.toggle("dense", cols >= 4);
    $("zoom").value = z;
    store.set("pp-zoom", String(z));
    follow();   // the live slide moved with the reflow; put it back in view
  }
  $("zoom").addEventListener("input", e => setZoom(e.target.value));
  window.addEventListener("resize", () => follow());

  // Tap a slide to put it on screen. The server only triggers it if this
  // presentation is still the live one.
  let jumping = false;
  async function jump(uuid, index, cue) {
    if (jumping || index === shownIndex) return;
    jumping = true;
    cue.classList.add("pend");
    try {
      await api.goto(uuid, index);
      if (navigator.vibrate) navigator.vibrate(15);
      highlight(index);
    } catch (e) {
      show(false, `Couldn't go to slide ${index + 1}: ${e.message}`);
    } finally {
      cue.classList.remove("pend");
      jumping = false;
      poll();
    }
  }

  async function poll() {
    try {
      const j = await api.live(shownUuid);
      show(true, "Connected to ProPresenter");
      $("item").textContent = j.item || j.name || "Nothing showing";
      $("pl").textContent = j.playlist ? `Playlist: ${j.playlist}` : "";
      if (!j.uuid) {
        if (shownUuid) { shownUuid = ""; shownIndex = null; thumbUuid = ""; showLive(null);
          $("slides").innerHTML = '<div class="empty">Nothing showing</div>'; }
        return;
      }
      if (j.slides) { shownUuid = j.uuid; shownIndex = null; buildSlides(j.uuid, j.slides); }
      highlight(j.index);
    } catch (e) {
      show(false, `Not connected: ${e.message}`);
    }
  }

  async function act(btn) {
    const name = btn.dataset.act;
    btn.disabled = true;
    const label = btn.textContent.trim();
    try {
      await api.action(name);
      if (navigator.vibrate) navigator.vibrate(15);
      poll();
    } catch (e) {
      show(false, `${label} failed: ${e.message}`);
    } finally {
      btn.disabled = false;
    }
  }

  document.querySelectorAll("button[data-act]").forEach(b =>
    b.addEventListener("click", () => act(b)));

  // ---- playlist arrangements ---------------------------------------------
  async function loadPlaylists() {
    const sel = $("plsel");
    plmsg(true, "Loading playlists…");
    try {
      const j = await api.playlists();
      playlistsLoaded = true;
      sel.innerHTML = "";
      if (!j.playlists.length) {
        sel.add(new Option("No playlists in ProPresenter", ""));
        plmsg(true, "");
        return;
      }
      sel.add(new Option("Choose a playlist…", ""));
      j.playlists.forEach(p => sel.add(new Option(p.name, p.uuid)));
      const last = store.get("pp-playlist");
      if (last && j.playlists.some(p => p.uuid === last)) {
        sel.value = last;
        loadPlaylist();
      } else {
        plmsg(true, "");
      }
    } catch (e) {
      plmsg(false, `Couldn't load playlists: ${e.message}`);
    }
  }

  let freshNext = false;
  async function loadPlaylist() {
    const id = $("plsel").value, list = $("items");
    list.innerHTML = "";
    plEditable = false;
    syncAddButton();
    if (!id) { plmsg(true, ""); return; }
    store.set("pp-playlist", id);
    plmsg(true, "Loading…");
    try {
      const j = await api.playlist(id, freshNext);
      freshNext = false;
      if (j.items.some(it => it.is_pco)) {
        plmsg(true, "Linked to Planning Center: arrangements are set there.");
      } else {
        plmsg(true, j.items.some(it => it.type === "presentation") ? "" : "No songs in this playlist.");
      }
      const pco = j.items.some(x => x.is_pco);
      // Items under an "Announcements" header (up to the next header) are shown
      // greyed out and can't be played, moved or removed from here.
      let section = "";
      j.items.forEach(it => {
        if (it.type === "header") section = it.name;
        list.appendChild(renderItem(id, it, pco, READ_ONLY_SECTION.test(section)));
      });
      plEditable = !pco;
      syncAddButton();
    } catch (e) {
      plmsg(false, `Couldn't load playlist: ${e.message}`);
    }
  }

  const READ_ONLY_SECTION = /announcement/i;
  const ICON_GRIP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
  const ICON_TRASH = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

  function renderItem(playlistId, it, isPco, readOnly) {
    if (it.type === "header") {
      const h = document.createElement("div");
      h.className = "hdr";
      h.textContent = it.name;
      return h;
    }
    const row = document.createElement("div");
    row.className = "song" + (readOnly ? " ro" : "");
    const nm = document.createElement("div");
    nm.className = "nm";
    nm.textContent = it.name;
    row.appendChild(nm);
    if (!isPco && !readOnly) {
      const grip = document.createElement("div");
      grip.className = "grip";
      grip.innerHTML = ICON_GRIP;
      grip.setAttribute("aria-label", `Drag to move ${it.name}`);
      grip.addEventListener("pointerdown", e => dragItem(e, row, playlistId, it));
      row.appendChild(grip);
    }
    const play = document.createElement("button");
    play.className = "play";
    play.textContent = "▶";
    play.setAttribute("aria-label", `Show ${it.name}`);
    play.disabled = readOnly;
    play.addEventListener("click", () => trigger(playlistId, it, play));
    row.appendChild(play);
    if (!isPco) {
      const rm = document.createElement("button");
      rm.className = "rm";
      rm.innerHTML = ICON_TRASH;
      rm.setAttribute("aria-label", `Remove ${it.name}`);
      rm.disabled = readOnly;
      rm.addEventListener("click", () => removeItem(playlistId, it, rm));
      row.appendChild(rm);
    }
    if (it.type !== "presentation") {
      const t = document.createElement("div");
      t.className = "other";
      t.style.padding = "0";
      t.textContent = it.type;
      row.appendChild(t);
      return row;
    }
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", `Arrangement for ${it.name}`);
    fillChoices(sel, it.choices, it.arrangement);
    const locked = isPco || readOnly;
    sel.disabled = locked;
    let current = it.arrangement;
    sel.addEventListener("change", async () => {
      let pick = sel.value;
      if (pick === OTHER) {
        const typed = prompt(`Arrangement name for "${it.name}" (exactly as in ProPresenter):`, "");
        if (typed === null || !typed.trim()) { sel.value = current; return; }
        pick = typed.trim();
      }
      if (pick === current) { sel.value = current; return; }
      row.classList.add("busy");
      sel.disabled = true;
      plmsg(true, `Setting "${it.name}" to ${pick || "no arrangement"}…`);
      try {
        await api.setArrangement(playlistId, it.index, it.name, pick);
        current = pick;
        if (pick && !it.choices.includes(pick)) it.choices.push(pick);
        fillChoices(sel, it.choices, current);
        plmsg(true, `"${it.name}" now uses ${current || "no arrangement"}.`);
        if (navigator.vibrate) navigator.vibrate(15);
      } catch (e) {
        fillChoices(sel, it.choices, current);
        plmsg(false, e.message);
      } finally {
        row.classList.remove("busy");
        sel.disabled = locked;
      }
    });
    row.appendChild(sel);
    return row;
  }

  function fillChoices(sel, choices, current) {
    sel.innerHTML = "";
    const names = choices.slice();
    if (current && !names.includes(current)) names.unshift(current);
    sel.add(new Option("No arrangement (slides in order)", NONE));
    names.forEach(n => sel.add(new Option(n, n)));
    sel.add(new Option("Other…", OTHER));
    sel.value = current || NONE;
  }

  // ---- putting one playlist item on screen ---------------------------------
  async function trigger(playlistId, it, btn) {
    btn.disabled = true;
    plmsg(true, `Showing "${it.name}"…`);
    try {
      await api.triggerPlaylist(playlistId, it.index, it.name);
      if (navigator.vibrate) navigator.vibrate(15);
      plmsg(true, `On screen: "${it.name}".`);
    } catch (e) {
      plmsg(false, e.message);
    } finally {
      btn.disabled = false;
    }
  }

  // ---- reordering: drag an item by its grip ---------------------------------
  // The row follows the finger through the list (the list scrolls near its
  // edges); letting go writes the new order to ProPresenter. Rows in #items are
  // one per playlist item, so a row's position is the item's new index.
  let moving = false;
  function dragItem(e, row, playlistId, it) {
    if (moving || e.button > 0) return;
    e.preventDefault();
    const list = $("items"), pid = e.pointerId;
    const from = [...list.children].indexOf(row);
    let y = e.clientY;
    moving = true;
    row.classList.add("drag");
    const place = () => {
      let before = null;
      for (const k of list.children) {
        if (k === row) continue;
        const r = k.getBoundingClientRect();
        if (y < r.top + r.height / 2) { before = k; break; }
      }
      if (before !== row.nextElementSibling) list.insertBefore(row, before);
    };
    const scroller = setInterval(() => {   // near the top or bottom edge: scroll
      const r = list.getBoundingClientRect(), edge = 60;
      const d = y < r.top + edge ? -12 : y > r.bottom - edge ? 12 : 0;
      if (d) { list.scrollTop += d; place(); }
    }, 30);
    // Listen on the document, not the grip: moving the row through the list
    // would drop a pointer capture on it.
    const onMove = ev => { if (ev.pointerId === pid) { y = ev.clientY; place(); } };
    const onEnd = async ev => {
      if (ev.pointerId !== pid) return;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onEnd);
      document.removeEventListener("pointercancel", onEnd);
      clearInterval(scroller);
      row.classList.remove("drag");
      const to = [...list.children].indexOf(row);
      if (ev.type === "pointercancel" || to === from) {   // nothing to save
        if (to !== from) await loadPlaylist();               // put the rows back
        moving = false;
        return;
      }
      plmsg(true, `Moving "${it.name}"…`);
      let err = null;
      try {
        await api.moveInPlaylist(playlistId, from, to, it.name);
        if (navigator.vibrate) navigator.vibrate(15);
      } catch (x) {
        err = x;
      }
      await loadPlaylist();
      moving = false;
      plmsg(!err, err ? err.message : `Moved "${it.name}".`);
    };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onEnd);
    document.addEventListener("pointercancel", onEnd);
  }

  // ---- editing: take an item out, add one from a library ------------------
  async function removeItem(playlistId, it, btn) {
    if (!confirm(`Remove "${it.name}" from this playlist?`)) return;
    btn.disabled = true;
    plmsg(true, `Removing "${it.name}"…`);
    try {
      await api.removeFromPlaylist(playlistId, it.index, it.name);
      await loadPlaylist();
      plmsg(true, `Removed "${it.name}".`);
    } catch (e) {
      btn.disabled = false;
      plmsg(false, e.message);
    }
  }

  const libCache = {};
  let libsLoaded = false;

  // The add button shows for a loaded, editable playlist while the picker is shut.
  let plEditable = false;
  function syncAddButton() {
    $("pladd").hidden = !plEditable || !$("adder").hidden;
  }

  function closeAdder() {
    $("adder").hidden = true;
    $("items").hidden = false;
    syncAddButton();
  }

  async function openAdder() {
    $("adder").hidden = false;
    $("items").hidden = true;
    syncAddButton();
    if (libsLoaded) return showLibrary();
    const sel = $("libsel");
    sel.innerHTML = "";
    sel.add(new Option("Loading libraries…", ""));
    try {
      const j = await api.libraries();
      sel.innerHTML = "";
      if (!j.libraries.length) {
        sel.add(new Option("No libraries", ""));
        plmsg(false, "ProPresenter reported no libraries.");
        return;
      }
      j.libraries.forEach(l => sel.add(new Option(l.name, l.uuid)));
      libsLoaded = true;
      const last = store.get("pp-library");
      if (last && j.libraries.some(l => l.uuid === last)) sel.value = last;
      showLibrary();
    } catch (e) {
      plmsg(false, `Couldn't load libraries: ${e.message}`);
    }
  }

  async function showLibrary() {
    const id = $("libsel").value, box = $("libitems");
    if (!id) { box.innerHTML = ""; return; }
    store.set("pp-library", id);
    if (!libCache[id]) {
      box.innerHTML = '<div class="libmore">Loading…</div>';
      try {
        libCache[id] = (await api.library(id)).items;
      } catch (e) {
        box.innerHTML = "";
        plmsg(false, `Couldn't load library: ${e.message}`);
        return;
      }
    }
    renderLibrary();
  }

  function renderLibrary() {
    const all = libCache[$("libsel").value] || [], box = $("libitems");
    const q = $("libq").value.trim().toLowerCase();
    const hits = q ? all.filter(it => it.name.toLowerCase().includes(q)) : all;
    const SHOW = 100;   // a big library would make a very long list; search narrows it
    box.innerHTML = "";
    hits.slice(0, SHOW).forEach(it => {
      const b = document.createElement("button");
      b.className = "libitem";
      b.textContent = it.name;
      b.addEventListener("click", () => addItem(it, b));
      box.appendChild(b);
    });
    const note = document.createElement("div");
    note.className = "libmore";
    note.textContent = !hits.length ? "Nothing matches." :
      hits.length > SHOW ? `Showing ${SHOW} of ${hits.length}. Type to narrow it down.` : "";
    if (note.textContent) box.appendChild(note);
  }

  async function addItem(it, btn) {
    const playlistId = $("plsel").value;
    if (!playlistId) return;
    btn.disabled = true;
    plmsg(true, `Adding "${it.name}"…`);
    try {
      await api.addToPlaylist(playlistId, it.uuid, it.name);
      if (navigator.vibrate) navigator.vibrate(15);
      await loadPlaylist();
      plmsg(true, `Added "${it.name}" at the end. Add more, or tap Done.`);
    } catch (e) {
      plmsg(false, e.message);
    } finally {
      btn.disabled = false;
    }
  }

  $("pladd").addEventListener("click", openAdder);
  $("addclose").addEventListener("click", () => {
    closeAdder();
    const list = $("items");
    list.scrollTop = list.scrollHeight;   // where the new items went
  });
  $("libsel").addEventListener("change", () => { $("libq").value = ""; showLibrary(); });
  $("libq").addEventListener("input", renderLibrary);

  $("plsel").addEventListener("change", () => { closeAdder(); loadPlaylist(); });
  // ↻ also re-reads every playlist for arrangement names (normally reused for 10 min).
  $("plreload").addEventListener("click", () => { playlistsLoaded = false; freshNext = true; loadPlaylists(); });

  // ---- macros ------------------------------------------------------------
  // One button per stage macro (STAGE_MACROS). A macro can change what's on screen, so
  // the first tap only arms it; a second tap within ARM_MS runs it.
  const ARM_MS = 3000;
  // Only these macros are shown, in this order. Names are matched ignoring case,
  // spaces and punctuation ("&" = "and"), so "Kid's Lyrics" also matches "KIDS
  // LYRICS". A name with no exact match takes the first macro containing it, so
  // "Welcome" finds "PRE-SERVICE - Welcome Splash".
  const STAGE_MACROS = ["Speaking", "Welcome", "Music & Lyrics", "Youth Music", "Kid's Lyrics"];
  const macroKey = s => String(s || "").toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
  let macrosLoaded = false, armed = null, armTimer = 0;

  function macmsg(ok, msg) {
    $("macmsg").textContent = msg;
    $("macmsg").classList.toggle("bad", !ok);
  }

  function disarm() {
    clearTimeout(armTimer);
    if (armed) armed.classList.remove("armed");
    armed = null;
  }

  function readableOn(hex) {   // dark text on light macro colours, white on dark
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
    if (!m) return "#fff";
    const [r, g, b] = m.slice(1).map(x => parseInt(x, 16) / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.6 ? "#111" : "#fff";
  }

  async function loadMacros() {
    const box = $("macros");
    disarm();
    macmsg(true, "Loading macros…");
    try {
      const j = await api.macros();
      macrosLoaded = true;
      box.innerHTML = "";
      const find = n => {
        const k = macroKey(n);
        return j.macros.find(m => macroKey(m.name) === k) || j.macros.find(m => macroKey(m.name).includes(k));
      };
      const shown = STAGE_MACROS.map(find).filter(Boolean);
      if (!shown.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = `None of these macros are in ProPresenter: ${STAGE_MACROS.join(", ")}.`;
        box.appendChild(empty);
        macmsg(true, "");
        return;
      }
      shown.forEach(m => {
        const b = document.createElement("button");
        b.className = "mac";
        if (m.color) { b.style.setProperty("--c", m.color); b.style.setProperty("--t", readableOn(m.color)); }
        const name = document.createElement("span");
        name.textContent = m.name || "(unnamed)";
        const hint = document.createElement("small");
        hint.textContent = "tap again to run";
        b.append(name, hint);
        b.addEventListener("click", () => tapMacro(m, b));
        box.appendChild(b);
      });
      const missing = STAGE_MACROS.filter(n => !find(n));
      if (missing.length) macmsg(false, `Not in ProPresenter: ${missing.join(", ")}.`);
      else macmsg(true, "Tap a macro, then tap again to run it.");
    } catch (e) {
      macmsg(false, `Couldn't load macros: ${e.message}`);
    }
  }

  async function tapMacro(m, b) {
    if (armed !== b) {           // first tap: arm this one (and only this one)
      disarm();
      armed = b;
      b.classList.add("armed");
      armTimer = setTimeout(disarm, ARM_MS);
      return;
    }
    disarm();                    // second tap: run it
    b.disabled = true;
    macmsg(true, `Running "${m.name}"…`);
    try {
      await api.triggerMacro(m.uuid);
      if (navigator.vibrate) navigator.vibrate(15);
      macmsg(true, `Ran "${m.name}".`);
    } catch (e) {
      macmsg(false, `"${m.name}" failed: ${e.message}`);
    } finally {
      b.disabled = false;
    }
  }

  $("macreload").addEventListener("click", () => { macrosLoaded = false; loadMacros(); });

  // ---- settings (app only): where ProPresenter is ------------------------
  if (APP) {
    $("tab-settings").hidden = false;
    $("ppurl").value = store.get("pp-url") || "";
    $("ppsave").addEventListener("click", async () => {
      const url = window.PPDirect.normalize($("ppurl").value);
      const msg = $("setmsg");
      msg.classList.remove("bad");
      if (!url) { msg.textContent = "Enter the address first."; msg.classList.add("bad"); return; }
      msg.textContent = "Connecting…";
      const next = window.PPDirect.create(url);
      try {
        await next.live("");
        store.set("pp-url", url);
        api = next;
        shownUuid = ""; shownIndex = null; playlistsLoaded = false; macrosLoaded = false;
        msg.textContent = "Connected.";
        openTab($("tab-remote"));
        poll();
      } catch (e) {
        msg.textContent = `Couldn't connect: ${e.message}`;
        msg.classList.add("bad");
      }
    });
  }

  // ---- start -------------------------------------------------------------
  setZoom(store.get("pp-zoom") || 4);
  const lastTab = $(store.get("pp-tab") || "tab-remote");
  if (APP && !store.get("pp-url")) openTab($("tab-settings"));   // first run
  else if (lastTab && !lastTab.hidden) openTab(lastTab);
  poll();
  setInterval(() => { if (!document.hidden && !$("v-remote").hidden) poll(); }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
